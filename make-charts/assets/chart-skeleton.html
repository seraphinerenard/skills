<!doctype html>
<!-- CONTRACT skill=design surface=chart palette=mono-pop body=16px accent=#1f4ed8 -->
<!-- CONTRACT skill=make-charts form=line source=yes -->
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast error fell from 21% to 9% after the February model change</title>
<style>
  /* @keep:tokens */
  :root {
    --bg: #fafafa; --surface: #ffffff; --border: #e4e4e7;
    --ink: #18181b; --muted: #52525b; --accent: #1f4ed8; --on-accent: #ffffff;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-sans); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .chart { max-width: 760px; margin: 40px auto; background: var(--surface);
           border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  svg { width: 100%; height: auto; display: block; }
  .grid { stroke: var(--border); stroke-width: 1; }
  .axis { stroke: var(--muted); stroke-width: 1; }
  .tick, .axis-label { font-size: 12px; fill: var(--muted); }
  .series-label { font-size: 12px; font-weight: 600; }
  .source { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
</style>
</head>
<body>
<figure class="chart" role="img"
  aria-label="Line chart: weekly forecast error for the new model against the seasonal-naive baseline, January to June 2026">
  <h1>Forecast error fell from 21% to 9% after the February model change</h1>
  <!-- allow:A1 disambiguates two real measurement bases a planner would confuse (orders vs shipments) -->
  <p class="subtitle">Mean absolute forecast error per week across all 214 SKUs, January to June 2026,
     versus the seasonal-naive baseline (grey). Error is measured against realized orders, not shipments.</p>

  <svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg">
    <!-- horizontal gridlines, at most 5, border token -->
    <g class="grid">
      <line x1="60" y1="260" x2="680" y2="260"/>
      <line x1="60" y1="200" x2="680" y2="200"/>
      <line x1="60" y1="140" x2="680" y2="140"/>
      <line x1="60" y1="80"  x2="680" y2="80"/>
      <line x1="60" y1="20"  x2="680" y2="20"/>
    </g>
    <!-- zero baseline -->
    <line class="axis" x1="60" y1="320" x2="680" y2="320"/>

    <!-- y tick labels, units in the axis label -->
    <g class="tick" text-anchor="end">
      <text x="52" y="324">0</text>
      <text x="52" y="264">5</text>
      <text x="52" y="204">10</text>
      <text x="52" y="144">15</text>
      <text x="52" y="84">20</text>
      <text x="52" y="24">25</text>
    </g>
    <text class="axis-label" transform="rotate(-90 16 170)" x="16" y="170" text-anchor="middle">Forecast error (%)</text>

    <!-- x tick labels -->
    <g class="tick" text-anchor="middle">
      <text x="80"  y="340">Jan</text>
      <text x="192" y="340">Feb</text>
      <text x="304" y="340">Mar</text>
      <text x="416" y="340">Apr</text>
      <text x="528" y="340">May</text>
      <text x="640" y="340">Jun</text>
    </g>

    <!-- context series: seasonal-naive baseline, muted, 1.5px -->
    <polyline class="series" fill="none" stroke="var(--muted)" stroke-width="1.5"
      points="80,32 192,42.8 304,50 416,34.4 528,45.2 640,40.4"/>
    <!-- data series: the finding, accent, 2.5px -->
    <polyline class="series" fill="none" stroke="var(--accent)" stroke-width="2.5"
      points="80,63.2 192,93.2 304,173.6 416,210.8 528,214.4 640,219.2"/>

    <!-- direct labels at line ends (C14): no legend -->
    <text class="series-label" x="648" y="44" fill="var(--muted)">Seasonal naive, 23.3%</text>
    <text class="series-label" x="648" y="223" fill="var(--accent)">New model, 8.4%</text>
  </svg>

  <p class="source">Source: demand-planning system, January to June 2026, retrieved 6 July 2026.</p>
</figure>
</body>
<!-- @keep:eof -->
</html>
